Texto técnico: Qualquer texto redigido segundo a norma culta da língua portuguesa
  e seguindo normas de escrita formal, geralmente direcionado para publicação ou
  aceitação de uma instituição, como universidades, escolas, ou jornais.
  
Mouse: Dispositivo de entrada usado para interagir com o computador, geralmente
  com formato ergonômico que cabe na mão do usuário. Permite mover um cursor na
  tela e executar comandos por meio de botões e, em muitos casos, de uma roda de
  rolagem ou sensores adicionais.

Linguagem de marcação: Conjunto de regras e símbolos usados para estruturar,
  organizar e descrever o conteúdo de um documento, distinguindo dados do texto
  de informações sobre sua forma ou significado. Exemplos comuns incluem HTML,
  XML e Markdown.

Código-fonte: Conjunto de instruções e comandos escritos em uma linguagem de
  programação legível por humanos, que descrevem o funcionamento de um software
  e podem ser compilados ou interpretados para execução em um computador.

Website: Conjunto de páginas e recursos interligados, acessíveis pela internet
  por meio de um endereço (URL). Geralmente possui conteúdos informativos,
  funcionais ou interativos e pode servir a fins pessoais, corporativos,
  educacionais ou comerciais.

Online: Estado de estar conectado a uma rede de computadores, especialmente a
  internet, permitindo acesso, comunicação ou uso de serviços digitais em tempo
  real. O oposto é offline, quando não há conexão.